name: AegisBox Continuous Delivery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-artifact:
    name: Build & Package Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compile Linux Binary (amd64)
        run: |
          mkdir -p bin dist
          VERSION="0.1.0"
          COMMIT_SHA="${GITHUB_SHA::7}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          
          echo "VERSION=${VERSION}" > RELEASE_METADATA
          echo "COMMIT_SHA=${COMMIT_SHA}" >> RELEASE_METADATA
          echo "BUILD_TIME=${BUILD_TIME}" >> RELEASE_METADATA
          
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.GitCommit=${COMMIT_SHA} -X main.BuildTime=${BUILD_TIME}" \
            -v -o bin/aegisbox ./cmd/aegisbox

      - name: Package Release Tarball
        run: |
          tar -czvf dist/aegisbox-linux-amd64.tar.gz \
            bin/aegisbox \
            configs/config.yaml \
            deploy/aegisbox.service \
            scripts/install.sh \
            scripts/deploy.sh \
            scripts/setup-rootfs.sh \
            RELEASE_METADATA

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegisbox-linux-amd64
          path: dist/aegisbox-linux-amd64.tar.gz
          retention-days: 14

  production-approval-gate:
    name: Production Approval & Delivery Notice
    needs: build-release-artifact
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download Packaged Artifact
        uses: actions/download-artifact@v4
        with:
          name: aegisbox-linux-amd64
          path: dist/

      - name: Publish Delivery Instructions
        run: |
          echo "### 🚀 AegisBox Release Approved for Delivery" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metadata | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Environment** | Ubuntu 24.04 VMware VM (Private LAN) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Host IP** | \`192.168.1.9\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | Approved & Ready for Operator Deployment |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Windows Operator Deployment Command:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`powershell" >> $GITHUB_STEP_SUMMARY
          echo "# From Windows workstation PowerShell:" >> $GITHUB_STEP_SUMMARY
          echo ".\\scripts\\deploy-remote.ps1 -TargetHost \"192.168.1.9\" -TargetUser \"ubuntu\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔧 Manual SSH Deployment Alternative:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "scp dist/aegisbox-linux-amd64.tar.gz ubuntu@192.168.1.9:/tmp/" >> $GITHUB_STEP_SUMMARY
          echo "ssh ubuntu@192.168.1.9 \"sudo /opt/aegisbox/scripts/deploy.sh /tmp/aegisbox-linux-amd64.tar.gz 8080\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
